<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="RONGDU Knowledge Hub: a lightweight knowledge publishing website for notes, guides, and research summaries."
    />
    <title>RONGDU Knowledge Hub</title>
    <link rel="stylesheet" href="./styles.css?v=20260522-anthropic-page" />
  </head>
  <body class="auth-locked">
    <div class="auth-screen" id="authScreen">
      <form class="auth-card" id="authForm">
        <span class="brand-mark">D</span>
        <p class="eyebrow">Protected Entry</p>
        <h1>Deafal 知识入口</h1>
        <p>请输入访问密码后浏览网页资料和 PPT。</p>
        <label>
          <span>访问密码</span>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="输入密码" />
        </label>
        <button class="button primary" id="unlockButton" type="button">进入内容库</button>
        <p class="auth-error" id="authError" role="alert" hidden>密码不正确，请重新输入。</p>
      </form>
    </div>

    <header class="site-header">
      <nav class="nav" aria-label="主导航">
        <a class="brand" href="#top" aria-label="返回首页">
          <span class="brand-mark">D</span>
          <span>Deafal Knowledge Hub</span>
        </a>
        <div class="nav-links">
          <a href="#articles">内容库</a>
          <a href="https://github.com/RONGDUGithub?tab=repositories" target="_blank" rel="noreferrer">GitHub</a>
          <button class="link-button" id="logoutButton" type="button">锁定</button>
        </div>
      </nav>
    </header>

    <main id="top">
      <section class="section articles-section" id="articles" aria-labelledby="articles-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Knowledge Library</p>
            <h2 id="articles-title">内容库</h2>
          </div>
          <label class="search">
            <span class="visually-hidden">搜索内容</span>
            <input id="searchInput" type="search" placeholder="搜索标题、摘要或关键词" />
          </label>
        </div>

        <div class="filters" id="categoryFilters" aria-label="分类筛选"></div>
        <div class="article-grid" id="articleGrid"></div>
        <p class="empty-state" id="emptyState" hidden>没有找到匹配的内容。</p>
      </section>
    </main>

    <script src="./script.js?v=20260522-anthropic-page"></script>
  </body>
</html>
